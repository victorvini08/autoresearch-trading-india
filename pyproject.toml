[project]
name = "autoresearch"
version = "0.1.0"
description = "Framework for LLM-driven autoresearch trading systems: walk-forward evaluator, anti-overfit gates, and swappable Broker/DataProvider/StrategyBase/CostModel interfaces. Ships an India/Dhan reference implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "backtrader>=1.9.78.123",
    "duckdb>=1.1.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "claude-agent-sdk>=0.1.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "lxml>=5.2.0",
    "tenacity>=9.0.0",
    "matplotlib>=3.9.0",
    "jinja2>=3.1.4",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the library package only — never the repo-root strategy.py, scripts/,
# or any storage/ data. A downstream user brings their own strategy + data.
packages = ["autoresearch"]

[project.scripts]
# Library entry points (work from an installed wheel). The reference
# operational commands (run_live, loop, daily_update, ...) live in scripts/ and
# are run from a clone via `python -m scripts.<name>` — see the README.
autoresearch-eval = "autoresearch.research.prepare:main"
autoresearch-data = "autoresearch.data.synthetic:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that hit the network (deselect by default)",
    "integration: end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
