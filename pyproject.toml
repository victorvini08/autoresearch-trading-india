[project]
name = "autoresearch-trading"
version = "0.1.3"
description = "Framework for LLM-driven autoresearch trading systems: walk-forward evaluator, anti-overfit gates, and swappable Broker/DataProvider/StrategyBase/CostModel interfaces. Ships an India/Dhan reference implementation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryan Mehta" }]
keywords = ["trading", "quant", "backtesting", "walk-forward", "anti-overfit", "autoresearch", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "backtrader>=1.9.78.123",
    "duckdb>=1.1.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "lxml>=5.2.0",
    "tenacity>=9.0.0",
    "matplotlib>=3.9.0",
    "jinja2>=3.1.4",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the library package only — never the repo-root strategy.py, scripts/,
# or any storage/ data. A downstream user brings their own strategy + data.
packages = ["autoresearch"]

[tool.hatch.build.targets.sdist]
# By default the sdist would bundle the WHOLE repo (strategy.py, journal.md,
# docs/, experiments/ ...). Restrict it to the library + license/readme so the
# published source distribution never carries the trained strategy or research.
only-include = ["autoresearch", "README.md", "LICENSE", "DISCLAIMER.md", "pyproject.toml"]

[project.urls]
Homepage = "https://github.com/victorvini08/autoresearch-trading-india"
Repository = "https://github.com/victorvini08/autoresearch-trading-india"
Issues = "https://github.com/victorvini08/autoresearch-trading-india/issues"

[project.scripts]
# Library entry points (work from an installed wheel). The reference
# operational commands (run_live, loop, daily_update, ...) live in scripts/ and
# are run from a clone via `python -m scripts.<name>` — see the README.
autoresearch = "autoresearch.cli:main"
autoresearch-trading = "autoresearch.cli:main"   # users type the install name
autoresearch-init = "autoresearch.scaffold:main"
autoresearch-eval = "autoresearch.research.prepare:main"
autoresearch-data = "autoresearch.data.synthetic:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that hit the network (deselect by default)",
    "integration: end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
